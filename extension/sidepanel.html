<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEO Shopping Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛍️ CLEO Shopping Assistant</h1>
            <p class="subtitle">Ask me about style, colors, materials, and more!</p>
        </header>

        <div class="chat-container">
            <div id="messages" class="messages">
                <div class="message bot-message">
                    <div class="message-content">
                        👋 Hi! I'm your style assistant. Try asking:
                        <ul>
                            <li>"Show me minimalist black sweaters"</li>
                            <li>"What colors go with beige?"</li>
                            <li>"Find wool items under $200"</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <input 
                    type="text" 
                    id="query-input" 
                    placeholder="Ask about products, styles, colors..."
                    autocomplete="off"
                />
                <button id="send-button">Send</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <span>Searching...</span>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
